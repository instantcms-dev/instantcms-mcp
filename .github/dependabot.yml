version: 2

updates:
  # Runtime-зависимости: только patch PR автоматически. minor/major для
  # поставляемого кода (mysql2, zod, MCP SDK) ревьюим руками — они меняют
  # то, что получают пользователи npm-пакета.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(deps)'
    groups:
      runtime-patches:
        patterns:
          - '@modelcontextprotocol/*'
          - 'fast-xml-parser'
          - 'fflate'
          - 'ini'
          - 'mysql2'
          - 'yaml'
          - 'zod'
        update-types: ['patch']
      dev-tooling:
        patterns:
          - '*'
        exclude-patterns:
          - '@modelcontextprotocol/*'
          - 'fast-xml-parser'
          - 'fflate'
          - 'ini'
          - 'mysql2'
          - 'yaml'
          - 'zod'
        update-types: ['minor', 'patch']
    # TypeScript 7 (нативный компилятор) не собирается на текущем тулчейне:
    # ts-jest@29 требует typescript <7, typescript-eslint@8 — <6.1. Мажорные
    # PR по typescript не открываем, пока оба не объявят поддержку; вернёмся
    # к вопросу руками.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # actions/checkout, setup-node и прочие — еженедельно, minor/patch.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(ci)'
