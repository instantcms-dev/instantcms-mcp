name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure PHP linter is available
        run: |
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y php-cli
          fi
          php -v

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run MCP integration tests
        run: npm run test:integration

      - name: Check AI adapters and skills
        run: npm run check:ai

      - name: Generate coverage
        if: matrix.node == '20'
        run: npm run test:coverage

  test-with-source:
    name: Test against pinned InstantCMS source
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure PHP linter is available
        run: |
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y php-cli
          fi
          php -v

      - name: Checkout pinned InstantCMS source
        run: |
          set -euo pipefail
          COMMIT=$(node -e "process.stdout.write(require('./knowledge/upstream.json').commit)")
          echo "Pinned InstantCMS commit: $COMMIT"
          git clone --filter=blob:none --no-checkout https://github.com/instantsoft/icms2.git .cache/icms2
          git -C .cache/icms2 fetch --depth 1 origin "$COMMIT"
          git -C .cache/icms2 checkout --detach --force FETCH_HEAD

      - name: Link ./source for Core Parser tests
        run: ln -s .cache/icms2 source

      # ICMS_REQUIRE_SOURCE=1 запрещает пропуск: если источник не найден,
      # сьюты падают, а не молча пропускаются. Так CI видит все тесты.
      - name: Run full test suite (skips forbidden)
        run: ICMS_SOURCE=.cache/icms2 ICMS_REQUIRE_SOURCE=1 npm test -- --runInBand

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.js

      # Полный путь пользователя: npm pack → install в чистую папку →
      # spawn → initialize/tools/list. Ловит ошибки packaging, которые
      # не видны тестам исходников.
      - name: E2E npm package smoke test
        run: npm run test:package

  integration:
    name: Generated artifacts on a live InstantCMS
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: icms
          MARIADB_DATABASE: icms_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -picms"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Ensure PHP with mysqli
        run: |
          if ! php -m 2>/dev/null | grep -qi '^mysqli$'; then
            sudo apt-get update
            sudo apt-get install -y php-cli php-mysql
          fi
          php -v
          php -m | grep -i '^mysqli$'

      - name: Install dependencies
        run: npm ci

      - name: Prepare InstantCMS source (pinned upstream)
        run: npm run knowledge:source:update

      - name: Install InstantCMS headlessly
        run: |
          node scripts/install-instantcms.mjs \
            --source .cache/icms2 --target /tmp/icms-site \
            --base-url http://127.0.0.1:8099 \
            --db-host 127.0.0.1 --db-name icms_ci \
            --db-user root --db-password icms

      - name: Start web server
        run: |
          php -S 127.0.0.1:8099 -t /tmp/icms-site /tmp/icms-site/index.php > /tmp/php-server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8099/; then
              echo "Site is up"
              exit 0
            fi
            sleep 1
          done
          echo "Site did not start"; cat /tmp/php-server.log; exit 1

      - name: Verify generated artifacts
        run: |
          set -e
          for scenario in crud api addon component webhook external_api oauth content_type widget routes crud_options crud_slug filter cache core_artifacts template_override admin_partial import_export cron form grid integration; do
            echo "::group::$scenario"
            npx tsx scripts/verify-generated.ts \
              --scenario "$scenario" --name "ci_$scenario" \
              --site /tmp/icms-site --base-url http://127.0.0.1:8099 \
              --db-name icms_ci --db-user root --db-password icms \
              --yes --cleanup
            echo "::endgroup::"
          done

      - name: Show server log on failure
        if: failure()
        run: tail -50 /tmp/php-server.log || true

  upstream-compatibility:
    name: InstantCMS upstream compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Ensure PHP linter is available
        run: |
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y php-cli
          fi
          php -v
      - name: Generate knowledge from latest stable InstantCMS
        run: npm run knowledge:update -- --ref latest
      - name: Link ./source for Core Parser tests
        run: ln -s .cache/icms2 source
      - name: Verify version API evidence against pinned tags
        run: |
          git -C .cache/icms2 fetch --refetch --no-filter origin 2.16.3 2.17.3 2.18.1 2.18.2
          npm run knowledge:versions:check
      - name: Verify generated source
        run: npm run typecheck && npm test -- --runInBand
        env:
          ICMS_REQUIRE_SOURCE: '1'
          ICMS_REQUIRE_PHP: '1'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Только зависимости рантайма: advisories в eslint/prettier не должны
      # блокировать выпуск, но уязвимости в поставляемом коде — должны.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  mutation:
    name: Mutation testing (sql-safety, serialization)
    runs-on: ubuntu-latest
    # Stryker 10 требует Node >=22 (см. @stryker-mutator/core:engines).
    # Этот job информирует о регрессии mutation score, но не блокирует merge —
    # best-effort, ~6 минут.
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        run: npm run mutation:test

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
          if-no-files-found: ignore
