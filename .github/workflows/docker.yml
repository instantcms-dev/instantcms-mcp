name: Docker

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['Dockerfile', '.github/workflows/docker.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish image to GHCR
    runs-on: ubuntu-latest
    # Публикация — только для тегов (и ручного запуска): на PR сборку образа
    # и /health проверяет job smoke. Иначе multi-arch сборка под QEMU (arm64)
    # падает на эмуляции и красит каждый PR с изменением Dockerfile.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        # Сборка arm64 идёт под QEMU и иногда падает с SIGILL (exit 132) на
        # `npm ci` — одинаковый коммит то собирается, то нет. Поэтому повторяем
        # до трёх раз, а не отдаём релиз по первой неудаче эмуляции.
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          args=(--platform linux/amd64,linux/arm64 --push)
          args+=(--cache-from type=gha --cache-to type=gha,mode=max)
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$IMAGE_TAGS"
          while IFS= read -r label; do
            if [ -n "$label" ]; then args+=(--label "$label"); fi
          done <<< "$IMAGE_LABELS"
          for attempt in 1 2 3; do
            echo "::group::docker buildx build, attempt $attempt"
            if docker buildx build "${args[@]}" .; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "build failed after 3 attempts"
          exit 1

  smoke:
    name: Dockerfile smoke (build + /health)
    # Закрывает риск «Dockerfile компилируется, но контейнер не стартует»:
    # поднимаем образ, ждём /health=200. Только на PR — теги идут в publish.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: instantcms-mcp:smoke

      - name: Start container and probe /health
        run: |
          set -euo pipefail
          # --init помогает корректно собирать сигналы (SIGTERM → exit);
          # --health-start-period=0s позволяет probe стартовать сразу.
          docker run --rm -d --init \
            --name instantcms-mcp-smoke \
            -p 13001:3001 \
            instantcms-mcp:smoke
          for _ in $(seq 1 30); do
            sleep 1
            code=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:13001/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "OK: /health=200"
              exit 0
            fi
          done
          echo "FAIL: /health never returned 200; dumping docker logs and inspect"
          docker logs instantcms-mcp-smoke >&2 || true
          docker inspect --format '{{json .State}}' instantcms-mcp-smoke >&2 || true
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f instantcms-mcp-smoke 2>/dev/null || true
